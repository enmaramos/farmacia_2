<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modal de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<!-- Botón para abrir el modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
    Ver Producto
</button>

<!-- Modal carrito -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content p-3">
            <div class="modal-body">
                <div class="d-flex justify-content-between align-items-center">
                    <!-- Imagen del producto -->
                    <img src="ruta-de-tu-imagen.png" alt="Ensure Advance" class="img-fluid" style="width: 100px;">

                    <!-- Información del producto -->
                    <div class="flex-grow-1 ms-3">
                        <h5 class="fw-bold text-primary">ENSURE ADVANCE VAINILLA 850GRS</h5>
                        <h4 class="fw-bold text-primary">C$.1,640.92</h4>
                        <p class="text-muted">Descuento Incluido</p>
                        <div class="d-flex align-items-center">
                            <button class="btn btn-outline-primary btn-sm" onclick="updateQuantity(-1)">-</button>
                            <input type="text" id="quantity" class="form-control mx-2 text-center" value="1" style="width: 40px;" readonly>
                            <button class="btn btn-outline-primary btn-sm" onclick="updateQuantity(1)">+</button>
                        </div>
                    </div>

                    <!-- Total y botón de eliminar -->
                    <div class="d-flex align-items-center">
                        <span id="totalPrice" class="fw-bold me-3">C$.1,640.92</span>
                        <button class="btn btn-danger btn-sm" onclick="removeProduct()">🗑</button>
                    </div>
                </div>

                <!-- Total General -->
                <hr>
                <h5 class="text-end">Total General: <span id="grandTotal" class="fw-bold">C$.1,640.92</span></h5>
            </div>
        </div>
    </div>
</div>

<script>
    const pricePerUnit = 1640.92; // Precio unitario del producto

    function updateQuantity(change) {
        let quantityInput = document.getElementById("quantity");
        let totalPrice = document.getElementById("totalPrice");
        let grandTotal = document.getElementById("grandTotal");

        let quantity = parseInt(quantityInput.value) + change;
        if (quantity < 1) quantity = 1; // Evita valores menores a 1

        quantityInput.value = quantity;
        let total = quantity * pricePerUnit;
        totalPrice.textContent = "C$." + total.toFixed(2);

        // Actualizar Total General (por ahora solo hay 1 producto)
        grandTotal.textContent = "C$." + total.toFixed(2);
    }

    function removeProduct() {
        document.getElementById("productModal").querySelector(".modal-body").innerHTML = "<h5 class='text-center text-danger'>Producto eliminado</h5>";
        document.getElementById("grandTotal").textContent = "C$.0.00"; // Total General en 0
    }
</script>

</body>
</html>
